name: Deploy to jsDelivr CDN

on:
  push:
    branches:
      - main # Escucha cambios en la rama "main"
  workflow_dispatch: # Permitir activación manual desde la pestaña de Actions

permissions:
  contents: write # Asegurar que se tienen permisos de escritura en el repositorio

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1. Dar checkout al repositorio
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Obtener la última versión y crear un nuevo tag mediante GitHub API
      - name: Create Tag with GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Obtener la última versión del repositorio
          latest_tag=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/tags" | jq -r '.[0].name')

          # Si no hay un tag previo, inicializar con v1.0.0
          if [ "$latest_tag" == "null" ] || [ -z "$latest_tag" ]; then
            new_tag="v1.0.0"
          else
            # Separar la versión en partes (major, minor, patch)
            major=$(echo $latest_tag | cut -d'.' -f1 | tr -d 'v')
            minor=$(echo $latest_tag | cut -d'.' -f2)
            patch=$(echo $latest_tag | cut -d'.' -f3)
            
            # Incrementar el patch (ajustar aquí si prefieres incrementar "minor" o "major")
            patch=$((patch + 1))
            new_tag="v${major}.${minor}.${patch}"
          fi

          echo "Creating new tag: $new_tag"

          # Crear el nuevo tag en el repositorio
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/$REPO/git/refs \
            -d "{\"ref\": \"refs/tags/$new_tag\", \"sha\": \"$(git rev-parse HEAD)\"}"

      # 3. Crear una release con archivos .js en el nuevo tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            gghfilter.bundle.js
            gghtable.bundle.js
          body: |
            ### Cambios:
            - Actualización automática con los scripts versionados.
            - Archivos JS disponibles para el CDN:
              - `gghfilter.bundle.js`
              - `gghtable.bundle.js`
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
